[project]
name = "minority-report"
version = "0.1.0"
description = "Recursive BRD generator: technical-brainstorm + premortem loop until green-lit."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "anthropic>=0.40",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "python-dotenv>=1.0",
    "sse-starlette>=2.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]
